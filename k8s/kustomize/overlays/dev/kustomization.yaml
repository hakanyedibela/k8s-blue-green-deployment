apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: bg-dev

configMapGenerator:
  - name: bg-config-dev
    envs:
      - .env
    options:
      disableNameSuffixHash: false

labels:
  - pairs:
      env: development

images:
  - name: default
    newName: hakanyedibela/blue-green-app
    newTag: v1.0.0

patches:
  - target:
      kind: Service
      name: blue-green
      version: v1
    patch: |-
      - op: replace
        path: /metadata/name
        value: blue-green-svc
  - target:
      kind: Deployment
      name: blue-green
      version: v1
    patch: |-
      - op: replace
        path: /metadata/name
        value: blue-green-deploy

patches:
  - path: deployment-dev.yaml
  - path: service-dev.yaml
  - path: namespace-dev.yaml