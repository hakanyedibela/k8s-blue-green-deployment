apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: bg-prod

configMapGenerator:
  - name: bg-config-prod
    files:
      - environment.properties
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      env: development

patches:
  - target:
      kind: Service
      name: blue-green
      version: v1
    patch: |-
      - op: replace
        path: /metadata/name
        value: blue-green-svc
  - target:
      kind: Deployment
      name: blue-green
      version: v1
    patch: |-
      - op: replace
        path: /metadata/name
        value: blue-green-deploy
        

patches:
  - path: deployment-dev.yaml
  - path: service-dev.yaml
  - path: namespace-dev.yaml